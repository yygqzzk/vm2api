# The fork retains full component regression and native amd64 image acceptance.
# Native ARM packaging remains an explicit manual check.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run all unit/web tests and formatting checks
        type: boolean
        default: false
      arm64:
        description: Build and smoke-test the native ARM image
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      go: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.go == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
      packaging: ${{ inputs.full || steps.filter.outputs.packaging == 'true' }}
      unit_tests: ${{ steps.filter.outputs.unit_tests_files || '[]' }}
      web_tests: ${{ steps.filter.outputs.web_tests_files || '[]' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          list-files: json
          filters: |
            backend:
              - 'src/**'
              - 'test/unit/**'
              - 'test/fixtures/**'
              - 'test/harness.mjs'
              - 'scripts/**/*.mjs'
              - 'package.json'
              - 'package-lock.json'
              - 'pnpm-lock.yaml'
              - 'biome.json'
              - '.github/workflows/test.yml'
            go:
              - 'worker/**'
              - 'api-kernel/**'
              - 'redact/**'
              - '.github/workflows/test.yml'
            web:
              - 'web/**'
              - '.github/workflows/test.yml'
            packaging:
              - 'deploy/**'
              - 'docker/**'
              - 'share/**'
              - 'scripts/docker-entrypoint.sh'
              - 'scripts/fetch-payload.mjs'
              - 'test/deploy/**'
              - '.github/workflows/test.yml'
            unit_tests:
              - added|modified: 'test/unit/*.test.mjs'
            web_tests:
              - added|modified: 'web/src/**/*.test.ts'
              - added|modified: 'web/src/**/*.test.tsx'

  ci:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: require change classification
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success
      - uses: actions/checkout@v7
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.packaging == 'true'
        with:
          fetch-depth: 0
      - name: merge current base
        if: github.event_name == 'pull_request' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.packaging == 'true')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git -c user.name=ci -c user.email=ci@localhost merge --no-edit FETCH_HEAD
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.packaging == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        if: needs.changes.outputs.backend == 'true'
      - uses: actions/setup-go@v7
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.backend == 'true' || inputs.full
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            worker/go.sum
            api-kernel/go.sum
            redact/go.sum
      - name: pinned payload
        if: needs.changes.outputs.packaging == 'true' || needs.changes.outputs.backend == 'true'
        run: |
          node scripts/fetch-payload.mjs
          node scripts/fetch-payload.mjs --check
      - name: native CLI packaging unit tests
        if: needs.changes.outputs.packaging == 'true'
        run: python3 -m unittest discover -s test/deploy -p test_native_cli.py -v
      - name: fork cutover backup selection
        if: needs.changes.outputs.packaging == 'true'
        run: python3 -m unittest discover -s test/deploy -p test_cutover_backup.py -v
      - name: backend syntax
        if: needs.changes.outputs.backend == 'true'
        run: find src scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: backend tests
        if: needs.changes.outputs.backend == 'true'
        env:
          FULL: ${{ inputs.full || github.repository == 'yygqzzk/vm2api' }}
          CHANGED_TESTS: ${{ needs.changes.outputs.unit_tests }}
        run: |
          if [ "$FULL" = true ]; then
            npm run test:unit
          else
            if jq -e 'index("test/unit/oauth-binary.test.mjs") != null' <<< "$CHANGED_TESTS" >/dev/null; then
              manifest="$RUNNER_TEMP/oauth-test-payload.json"
              jq -e '.files |= map(select(.path == "bin/kin-oauth-auth")) | select(.files | length == 1)' deploy/payload.json > "$manifest"
              node scripts/fetch-payload.mjs --manifest "$manifest"
              node scripts/fetch-payload.mjs --manifest "$manifest" --check
            fi
            tests=$(jq -r '.[] | split("/")[-1]' <<< "$CHANGED_TESTS")
            changed=()
            if [ -n "$tests" ]; then
              mapfile -t changed <<< "$tests"
            fi
            npm run test:ci -- "${changed[@]}"
          fi
      - name: Go tests
        if: needs.changes.outputs.go == 'true'
        run: |
          (cd worker && go test ./...)
          (cd api-kernel && go test ./...)
          (cd redact && go test ./...)
      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.web == 'true'
        with:
          version: 10
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - name: web tests and build
        if: needs.changes.outputs.web == 'true'
        working-directory: web
        env:
          FULL: ${{ inputs.full || github.repository == 'yygqzzk/vm2api' }}
          CHANGED_TESTS: ${{ needs.changes.outputs.web_tests }}
        run: |
          pnpm install --frozen-lockfile
          if [ "$FULL" = true ]; then
            pnpm test
          else
            tests=$(jq -r '.[] | ltrimstr("web/")' <<< "$CHANGED_TESTS")
            changed=()
            if [ -n "$tests" ]; then
              mapfile -t changed <<< "$tests"
            fi
            pnpm test:ci "${changed[@]}"
          fi
          pnpm build
      - name: full formatting checks
        if: inputs.full
        run: |
          npx biome format
          test -z "$(gofmt -l worker api-kernel redact)" || { gofmt -l worker api-kernel redact; exit 1; }
          pnpm -C web format:check

  fork-images-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: worker/go.sum
      - run: npm ci
      - name: browser offline contracts
        run: |
          node --test test/unit/slot-browser-*.test.mjs
          python3 -m unittest discover -s test/deploy -p test_slot_browser.py -v
      - name: build native browser and exit helper
        run: |
          docker build --label org.opencontainers.image.revision="$REVISION" \
            --label io.vm2api.fork.feature=slot-browser \
            -t "local/vm2api-slot-browser:fork-$REVISION" \
            docker/fork/slot-browser
          mkdir -p .local/slot-browser-test
          (cd worker && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -o ../.local/slot-browser-test/kin-egress ./cmd/kin-egress)
      - name: native sandbox, profiles and fail-closed network
        env:
          VM2API_BROWSER_IMAGE: >-
            local/vm2api-slot-browser:fork-${{ env.REVISION }}
          KIN_BROWSER_SMOKE_EGRESS: >-
            ${{ github.workspace }}/.local/slot-browser-test/kin-egress
        run: node test/deploy/smoke_slot_browser.mjs
      - name: build complete control-plane image
        run: |
          docker build --platform linux/amd64 \
            --label org.opencontainers.image.revision="$REVISION" \
            --label io.vm2api.fork.feature=slot-browser \
            -t "local/vm2api:fork-$REVISION" .
      - name: control-plane image regression
        run: |
          docker run --rm --network none --entrypoint sh \
            -e KIN_DATA_DIR=/tmp/kin-image-tests \
            -v "$PWD/test:/opt/vm2api/test:ro" \
            "local/vm2api:fork-$REVISION" -c '
              cp -a image-bin/. bin/
              mkdir -p share/wrap-cli share/crag
              cp -a image-wrap-cli/. share/wrap-cli/
              cp -a image-crag/. share/crag/
              exec node --test test/unit/fork-codex-stream.test.mjs \
                test/unit/codex-kernel-client.test.mjs \
                test/unit/codex-models.test.mjs \
                test/unit/vm-test-chat-codex.test.mjs \
                test/unit/oauth-auth-url.test.mjs \
                test/unit/gpt-model-policy.test.mjs \
                test/unit/codex-image-tool.test.mjs \
                test/unit/database.test.mjs \
                test/unit/database-metrics.test.mjs \
                test/unit/fork-migration-upgrade.test.mjs \
                test/unit/request-correlation.test.mjs \
                test/unit/gateway-retry.test.mjs \
                test/unit/api-tool-roundtrip.test.mjs \
                test/unit/redaction-*.test.mjs \
                test/unit/graceful-shutdown.test.mjs \
                test/unit/slot-browser-*.test.mjs \
                test/unit/proxy-geo-refresh.test.mjs \
                test/unit/proxy-probe-tunnel.test.mjs \
                test/unit/proxy-ipv6.test.mjs \
                test/unit/proxy-cli-enabled.test.mjs \
                test/unit/proxy-timezone-api.test.mjs
            '
      - name: isolated panel and bundled kernel startup
        env:
          VM2API_TEST_CONTROL_IMAGE: local/vm2api:fork-${{ env.REVISION }}
        run: node test/deploy/smoke_control_image.mjs
      - name: export the tested images
        run: |
          docker image inspect "local/vm2api-slot-browser:fork-$REVISION" \
            > browser-image.json
          docker image inspect "local/vm2api:fork-$REVISION" \
            > control-image.json
          docker save "local/vm2api-slot-browser:fork-$REVISION" \
            "local/vm2api:fork-$REVISION" | gzip > vm2api-linux-amd64.tar.gz
          sha256sum vm2api-linux-amd64.tar.gz > vm2api-linux-amd64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: fork-images-linux-amd64
          retention-days: 7
          compression-level: 0
          path: |
            vm2api-linux-amd64.tar.gz
            vm2api-linux-amd64.tar.gz.sha256
            browser-image.json
            control-image.json

  # Publish the exact images that passed the amd64 job; production pulls
  # by digest.
  ghcr-push:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    needs: [ci, fork-images-amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      REVISION: ${{ github.sha }}
      REGISTRY: ghcr.io
      NAMESPACE: yygqzzk
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fork-images-linux-amd64
      - name: verify and load the tested archive
        run: |
          sha256sum -c vm2api-linux-amd64.tar.gz.sha256
          gzip -t vm2api-linux-amd64.tar.gz
          gzip -dc vm2api-linux-amd64.tar.gz | docker load
      - name: push tested images to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login "$REGISTRY" \
            -u "${{ github.actor }}" --password-stdin
          control="$REGISTRY/$NAMESPACE/vm2api:fork-$REVISION"
          browser="$REGISTRY/$NAMESPACE/vm2api-slot-browser:fork-$REVISION"
          docker tag "local/vm2api:fork-$REVISION" "$control"
          docker tag "local/vm2api-slot-browser:fork-$REVISION" "$browser"
          docker push "$control"
          docker push "$browser"
          {
            echo "control_digest=$(docker inspect --format \
              '{{index .RepoDigests 0}}' "$control")"
            echo "browser_digest=$(docker inspect --format \
              '{{index .RepoDigests 0}}' "$browser")"
          } >> "$GITHUB_STEP_SUMMARY"

  arm64-native-cli:
    if: github.event_name == 'workflow_dispatch' && inputs.arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: prepare pinned x86 kernel emulation
        run: python3 deploy/prepare-arm64.py
      - name: build native ARM control plane
        run: docker build -f deploy/Dockerfile.arm64-control -t vm2api-native-cli-ci .
      - name: offline large-body, concurrency and cancel regression
        run: |
          docker run --network none --cpus 2 --memory 3g --pids-limit 256 \
            --entrypoint python3 -v "$PWD/test/deploy/smoke_native_cli.py:/smoke.py:ro" \
            vm2api-native-cli-ci /smoke.py
