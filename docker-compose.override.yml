# Docker Desktop (WSL): vm2api uses network_mode=host, which binds inside the
# Docker Desktop Linux VM (172.17.0.1:8787), not the WSL distro. Publish the
# console on 127.0.0.1:8788 so the host can reach it.
services:
  mac-proxy:
    image: alpine/socat
    container_name: vm2api-mac-proxy
    restart: unless-stopped
    depends_on:
      - vm2api
    ports:
      - "127.0.0.1:8788:8787"
    command: ["TCP-LISTEN:8787,fork,reuseaddr", "TCP:172.17.0.1:8787"]
